<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="100%" height="100%">
  <defs>
    <filter id="glow-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#E91E63" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sparkles around head -->
  <path d="M48 60 Q48 68 56 68 Q48 68 48 76 Q48 68 40 68 Q48 68 48 60 Z" fill="#FFB74D" />
  <path d="M196 50 Q196 59 205 59 Q196 59 196 68 Q196 59 187 59 Q196 59 196 50 Z" fill="#BA68C8" />
  <path d="M182 110 Q182 116 188 116 Q182 116 182 122 Q182 116 176 116 Q182 116 182 110 Z" fill="#FF80AB" />

  <!-- Floating Hearts -->
  <path d="M52 38 C42 22, 22 28, 22 44 C22 58, 38 70, 52 82 C66 70, 82 58, 82 44 C82 28, 62 22, 52 38 Z" 
        fill="#FF4081" transform="translate(14, -12) scale(0.35) rotate(-10 52 38)" />
  <path d="M52 38 C42 22, 22 28, 22 44 C22 58, 38 70, 52 82 C66 70, 82 58, 82 44 C82 28, 62 22, 52 38 Z" 
        fill="#E91E63" transform="translate(142, -5) scale(0.38) rotate(15 52 38)" />

  <!-- Character Body -->
  <g filter="url(#glow-shadow)">
    <!-- White bean body -->
    <path d="M72 195 
             C70 120, 68 70, 95 48 
             C120 28, 165 30, 180 58 
             C195 86, 190 135, 192 195 
             Z" 
          fill="#FFFFFF" 
          stroke="#1E1926" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Head curvature line -->
    <path d="M68 85 
             C60 68, 85 45, 120 45 
             C165 45, 182 66, 174 85 
             C162 100, 115 104, 78 96" 
          fill="#FFFFFF" 
          stroke="#1E1926" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Big rosy blushing cheeks -->
    <ellipse cx="78" cy="88" rx="10" ry="7" fill="#FF8DA1" opacity="0.9" />
    <ellipse cx="160" cy="84" rx="10" ry="7" fill="#FF8DA1" opacity="0.9" />

    <!-- Joyful Eyes (happy arcs or dots) -->
    <circle cx="95" cy="78" r="4.5" fill="#1E1926" />
    <circle cx="145" cy="76" r="4.5" fill="#1E1926" />

    <!-- Big beaming smile -->
    <path d="M88 88 Q118 108 155 86" 
          fill="none" 
          stroke="#1E1926" 
          stroke-width="5" 
          stroke-linecap="round" />

    <!-- Clasped hands / arms hugging heart -->
    <path d="M74 150 C80 125, 96 115, 116 132" 
          fill="none" 
          stroke="#1E1926" 
          stroke-width="4.5" 
          stroke-linecap="round"/>
    <path d="M184 150 C176 125, 155 115, 134 132" 
          fill="none" 
          stroke="#1E1926" 
          stroke-width="4.5" 
          stroke-linecap="round"/>

    <!-- Tiny cute heart held in hands -->
    <path d="M52 38 C42 22, 22 28, 22 44 C22 58, 38 70, 52 82 C66 70, 82 58, 82 44 C82 28, 62 22, 52 38 Z" 
          fill="#E91E63" transform="translate(108, 122) scale(0.32) translate(-52, -38)" />
    
    <!-- Hands joined below heart -->
    <ellipse cx="125" cy="142" rx="10" ry="6" fill="#1E1926" />
  </g>
</svg>
